<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;font-family:system-ui,sans-serif;color:var(--tg-theme-text-color);background:var(--tg-theme-bg-color)}
.top{display:flex;align-items:center;gap:12px}
svg{flex:none}
.v{font-weight:600;font-size:15px;line-height:1.3}
.t{color:var(--tg-theme-hint-color);font-size:12px;margin-bottom:2px}
ul{margin:10px 0 0;padding-left:18px;font-size:13px;line-height:1.35}
li{margin-bottom:4px}
</style>
<div class="top">
<svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--tg-theme-section-separator-color)" stroke-width="7"/><circle id="arc" cx="32" cy="32" r="26" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="0 999" transform="rotate(-90 32 32)"/><text id="num" x="32" y="37" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor"></text></svg>
<div><div class="t">Риск мошенничества</div><div class="v" id="v"></div></div>
</div>
<ul id="r"></ul>
<script>
// Только показ отчёта: запросов к боту нет, текст — только через textContent.
var W = window.TelegramWidget;
var C = { low: '#2e9e5b', medium: '#d9a400', high: '#ef7d00', critical: '#e53935' };
function $(id) { return document.getElementById(id); }
function render() {
  var st = null;
  try { st = JSON.parse(W.chatData); } catch (e) {}
  if (!st) { $('v').textContent = 'Проверяю…'; return; }
  var s = Math.max(0, Math.min(100, st.s | 0)), len = 2 * Math.PI * 26, arc = $('arc');
  arc.setAttribute('stroke', C[st.l] || C.medium);
  arc.animate([{ strokeDasharray: '0 999' }, { strokeDasharray: (len * s / 100) + ' 999' }],
              { duration: 700, fill: 'forwards', easing: 'ease-out' });
  $('num').textContent = s;
  $('v').textContent = st.v || '';
  var ul = $('r'); ul.textContent = '';
  (st.r || []).forEach(function (t) { var li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
  if (st.l === 'high' || st.l === 'critical') {
    try { W.HapticFeedback.notificationOccurred(st.l === 'critical' ? 'error' : 'warning'); } catch (e) {}
  }
}
if (W) { W.onEvent('chatDataChanged', render); render(); }
</script>
